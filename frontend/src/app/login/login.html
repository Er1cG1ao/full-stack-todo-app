<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card mt-5">
      <div class="card-header bg-primary text-white">
        <h3 class="text-center">Login</h3>
      </div>
      <div class="card-body">
        @if (errorMessage) {
          <div class="alert alert-danger">{{ errorMessage }}</div>
        }

        <form>
          <div class="form-group">
            <p class="text-info mt-2">
              当前输入：{{ username }}（{{ username.length }} 个字符）
            </p>
            <label for="username">Username</label>
            <input type="text" id="username" class="form-control"
                   [(ngModel)]="username" name="username" placeholder="Enter username">
          </div>

          <div class="form-group mt-3">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control"
                   [(ngModel)]="password" name="password" placeholder="Enter password">
          </div>

          <button type="button" class="btn btn-primary btn-block mt-4" (click)="handleLogin()">
            Sign In
          </button>
          <button type="button" class="btn btn-primary btn-block mt-4" (click)="clearForm()">
            Clear
          </button>
          <button type="button" class="btn btn-secondary btn-block mt-4" (click)="fillDummyCredentials()">
            Fill Dummy Credentials
          </button>
        </form>

        <p class="text-muted mt-3 text-center">
          Demo account: username = alice, password = dummy
        </p>
      </div>
    </div>
  </div>
</div>
