<h2>{{ id === -1 ? 'Add Todo' : 'Update Todo #' + id }}</h2>

@if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}

<form (ngSubmit)="!todoForm.invalid && saveTodo()" #todoForm="ngForm">
  @if (todoForm.dirty && description.invalid) {
    <div class="alert alert-warning">Description 至少 5 个字符</div>
  }
  @if (todoForm.dirty && targetDate.invalid) {
    <div class="alert alert-warning">请填写 Target Date</div>
  }

  <div class="form-group">
    <label for="description">Description</label>
    <input type="text" id="description" class="form-control" name="description"
           #description="ngModel" [(ngModel)]="todo.description"
           required minlength="5">
  </div>

  <div class="form-group mt-3">
    <label for="targetDate">Target Date</label>
    <input type="date" id="targetDate" class="form-control" name="targetDate"
           #targetDate="ngModel" [(ngModel)]="todo.targetDate" required>
  </div>

  <div class="form-check mt-3">
    <input type="checkbox" id="done" class="form-check-input"
           name="done" [(ngModel)]="todo.done">
    <label class="form-check-label" for="done">Done</label>
  </div>

  <button type="submit" class="btn btn-success mt-4" [disabled]="todoForm.invalid">Save</button>
  <a class="btn btn-link mt-4" routerLink="/todos">Cancel</a>
</form>
