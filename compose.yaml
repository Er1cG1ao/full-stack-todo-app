services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/todo-db
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_CORS_ALLOWED_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
    volumes:
      - todo-data:/app/data
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  todo-data:
