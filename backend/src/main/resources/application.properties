spring.application.name=daylight-api
server.address=127.0.0.1

# The frontend runs on 4200, the backend on 8080 — different ports means cross-origin.
# Pulled out into a config property instead of hardcoded in @CrossOrigin, so changing
# the port doesn't require touching Java code.
app.cors.allowed-origin=http://localhost:4200

# Turn this on to see detailed per-request logs (handy for demoing CORS preflight in class)
# logging.level.org.springframework.web=DEBUG

spring.datasource.url=jdbc:h2:file:./data/todo-db
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.persistent=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
