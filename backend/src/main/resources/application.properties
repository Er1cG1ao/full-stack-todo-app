spring.application.name=todo-backend

# The frontend runs on 4200, the backend on 8080 — different ports means cross-origin.
# Pulled out into a config property instead of hardcoded in @CrossOrigin, so changing
# the port doesn't require touching Java code.
app.cors.allowed-origin=http://localhost:4200

# Turn this on to see detailed per-request logs (handy for demoing CORS preflight in class)
# logging.level.org.springframework.web=DEBUG

spring.datasource.url=jdbc:h2:file:./data/todo-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false