              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Duplicate name or stale version",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Authentication rate limit exceeded",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer"
                },
                "description": "Seconds until another attempt"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "JSESSIONID"
      },
      "csrfHeader": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-TOKEN"
      }
    },
    "schemas": {
      "Health": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "UP",
              "DOWN"
            ]
          }
        }
      },
      "AuthUser": {
        "type": "object",
        "required": [
          "username"
        ],
        "properties": {
          "username": {
            "type": "string"
          }
        }
      },
      "Registration": {
        "allOf": [
          {
            "$ref": "#/components/schemas/AuthUser"
          },
          {
            "$ref": "#/components/schemas/RecoveryResponse"
          }
        ]
      },
      "RecoveryResponse": {
        "type": "object",
        "required": [
          "recoveryCode"
        ],
        "properties": {
          "recoveryCode": {
            "type": "string",
            "description": "Shown once, never stored plaintext on the server; treat as an account credential"
          }
        }
      },
      "Credentials": {
        "type": "object",
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 50,
            "pattern": "^[A-Za-z0-9_.-]+$"
          },
          "password": {
            "type": "string",
            "format": "password",
            "minLength": 8,
            "description": "Maximum 72 UTF-8 bytes (length validation applies at signup)"
          }
        }
      },
      "Csrf": {
        "type": "object",
        "required": [
          "headerName",
          "token"
        ],
        "properties": {
          "headerName": {
            "type": "string",
            "example": "X-CSRF-TOKEN"
          },
          "token": {
            "type": "string"
          }
        }
      },
      "Subtask": {
        "type": "object",
        "required": [
          "id",
          "title",
          "done"
        ],
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "done": {
            "type": "boolean"
          }
        }
      },
      "TaskInput": {
        "type": "object",
        "required": [
          "description"
        ],
        "properties": {
          "description": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "targetDate": {
            "type": "string",
            "format": "date",
            "nullable": true
          },
          "done": {
            "type": "boolean",
            "default": false
          },
          "notes": {
            "type": "string",
            "maxLength": 4000,
            "default": ""
          },
          "priority": {
            "type": "string",
            "enum": [
              "LOW",
              "MEDIUM",
              "HIGH"
            ],
            "default": "MEDIUM"
          },
          "project": {
            "type": "string",
            "maxLength": 80,
            "default": "",
            "description": "Existing project name in the signed-in account, or empty string for Inbox"
          },
          "tags": {
            "type": "string",
            "maxLength": 500,
            "default": "",
            "description": "Comma-separated tags; normalized/deduplicated on save"
          },
          "recurrence": {
            "type": "string",
            "enum": [
              "NONE",
              "DAILY",
              "WEEKLY",
              "MONTHLY"
            ],
            "default": "NONE",
            "description": "Newly completing a recurring occurrence generates one next task. Overdue dates advance from today."
          },
          "starred": {
            "type": "boolean",
            "default": false
          },
          "subtasks": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/Subtask"
            },
            "description": "Unique IDs; serialized total up to 16000 characters"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "description": "Required for canonical PUT; use the last server-returned version"
          }
        }
      },
      "Task": {
        "allOf": [
          {
            "$ref": "#/components/schemas/TaskInput"
          },
          {
            "type": "object",
            "properties": {
              "id": {
                "type": "integer",
                "format": "int64",
                "readOnly": true
              },
              "username": {
                "type": "string",
                "readOnly": true
              },
              "createdAt": {
                "type": "string",
                "format": "date-time",
                "readOnly": true
              },
              "updatedAt": {
                "type": "string",
                "format": "date-time",
                "readOnly": true
              },
              "completedAt": {
                "type": "string",
                "format": "date-time",
                "nullable": true,
                "readOnly": true
              },
              "deletedAt": {
                "type": "string",
                "format": "date-time",
                "nullable": true,
                "readOnly": true
              }
            }
          }
        ]
      },
      "ProjectInput": {
        "type": "object",
        "required": [
          "name",
          "color"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "color": {
            "type": "string",
            "pattern": "^#[0-9a-fA-F]{6}$",
            "example": "#708965"
          }
        }
      },
      "Project": {
        "allOf": [
          {
            "$ref": "#/components/schemas/ProjectInput"
          },
          {
            "type": "object",
            "properties": {
              "id": {
                "type": "integer",
                "format": "int64",
                "readOnly": true
              }
            }
          }
        ]
      },
      "Backup": {
        "type": "object",
        "required": [
          "formatVersion",
          "tasks",
          "projects"
        ],
        "properties": {
          "formatVersion": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "exportedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "username": {
            "type": "string",
            "description": "Informational only; never trusted during import"
          },
          "tasks": {
            "type": "array",
            "maxItems": 500,
            "items": {
              "$ref": "#/components/schemas/Task"
            }
          },
          "projects": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/ProjectInput"
            }
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "status",
          "message"
        ],
        "properties": {
          "status": {
            "type": "integer"
          },
          "message": {
            "type": "string"
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          },
          "path": {
            "type": "string"
          },
          "retryAfter": {
            "type": "integer"
          }
        }
      }
    },
    "parameters": {
      "ClientTimeZone": {
        "name": "X-Time-Zone",
        "in": "header",
        "required": false,
        "description": "IANA browser time zone for recurrence date calculations. Missing header uses the server calendar.",
        "schema": {
          "type": "string",
          "example": "America/New_York"
        }
      }
    }
  }
}
