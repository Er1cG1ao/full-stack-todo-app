    "/auth/recover": {
      "post": {
        "summary": "Reset with a saved one-time key; old sessions invalidated and key consumed",
        "security": [
          {
            "csrfHeader": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "username",
                  "recoveryCode",
                  "newPassword"
                ],
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "recoveryCode": {
                    "type": "string",
                    "pattern": "^DAYLIGHT-[A-Za-z0-9_-]{43}$"
                  },
                  "newPassword": {
                    "type": "string",
                    "format": "password",
                    "minLength": 8
                  }
                }
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Reset with a saved one-time key; old sessions invalidated and key consumed"
