{
  "openapi": "3.0.3",
  "info": {
    "title": "Daylight API",
    "version": "1.0.0",
    "description": "Private task/project workspace. Retain JSESSIONID cookies. GET /auth/csrf returns the header/token required for EVERY write, including login/register/recovery/logout. Fetch a new token after authentication changes. All canonical resource ownership comes from the session. /users/{username}/todos is deprecated."
  },
  "servers": [
    {
      "url": "/",
      "description": "Current origin; development backend listens on port 8080"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
