# ─────────────────────────────────────────────────────────────────────────────
# lesson6 API specification (OpenAPI 3.0.3)
#
# This file is the requirements document for this lesson. It exists before the code —
# your job is to implement the backend against it.
#
# How to read it:
#   1. Double-click lesson6/api-spec/api-docs.en.html (no dependencies, works offline)
#   2. Or paste this whole file into https://editor.swagger.io
#   3. Once the backend is running: http://localhost:8080/swagger-ui.html
#
# Every operation carries an x-lesson-step pointing at the matching step in the lesson plan.
#
# NOTE: this is the English counterpart of openapi.yaml. Keep the two in sync.
# ─────────────────────────────────────────────────────────────────────────────
openapi: 3.0.3

info:
  title: Todo Backend API
  version: "1.0.0"
  description: |
    REST API for the companion Angular frontend in this repository.

    ### Where this document came from
    It was not invented — it was **derived from the code that already calls it**.
    Compare against `frontend/src/app/service/data/todo-data.service.ts`:
    every `this.http.xxx(...)` there maps to one operation below.

    ### Three conventions that run through the whole document
    1. **A URL names a resource (a noun); the HTTP method is the verb** — which is why
       you will not find a URL like `/getTodo`.
    2. **Todos belong to people.** Every todo operation lives under `/users/{username}/`,
       and one user cannot reach another user's data (they get a 404, not a 403 — see below).
    3. **Error bodies have a fixed shape** and must carry a `message` field —
       the frontend reads `error.error.message`, and without it users see gibberish.

    ### Persistence and authentication
    - Todos are persisted in a file-based H2 database through Spring Data JPA.
    - The frontend login is a client-side demonstration. The API does not enforce the
      `Authorization` header and must not be treated as production authentication.

# No authentication in this version — an empty array explicitly declares
# "none of these operations require auth". This is a statement, not an omission:
# redocly lint's security-defined rule asks you to take a position.
security: []

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: hello-world
    description: Warm-up endpoints used to prove the frontend can reach the backend
  - name: todos
    description: Create, read, update and delete todos

paths:

  /hello-world-bean:
    get:
      tags: [hello-world]
      summary: Return a greeting
      description: |
        Called by `WelcomeDataService.executeHelloWorldBeanService()` in the frontend.
        It has exactly one purpose: **prove the two sides can talk before writing any real endpoint.**
      operationId: helloWorldBean
      x-lesson-step: Step 1-①
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloWorldBean"
              example:
                message: Hello World

  /hello-world/path-variable/{name}:
    get:
      tags: [hello-world]
      summary: Echo back the name from the path
      description: |
        Practice for `@PathVariable`: a segment of the URL becomes a method parameter.
        Called by `executeHelloWorldServiceWithPathVariable(name)` in the frontend.
      operationId: helloWorldPathVariable
      x-lesson-step: Step 1-②
      parameters:
        - name: name
          in: path
          required: true
          description: The name to echo back
          schema:
            type: string
          example: Zhongyan
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloWorldBean"
              example:
                message: "Hello World, Zhongyan! (from Spring Boot)"

  /users/{username}/todos:
    parameters:
      - $ref: "#/components/parameters/Username"

    get:
      tags: [todos]
      summary: List every todo belonging to one user
      description: |
        **Return only the rows that belong to this username.**

        This is the easiest one to get wrong: a plain `return todos;` also makes the frontend
        show data — but then everyone sees everyone else's todos. In a real system that is a
        data leak.

        Frontend: the `ListTodos` page calls it on load and after every create/update/delete.
      operationId: getAllTodos
      x-lesson-step: Step 4-① / Step 5-③
      responses:
        "200":
          description: Success. **When there is nothing to return, return an empty array `[]`, not a 404.**
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Todo"
              examples:
                With data:
                  value:
                    - id: 1
                      username: alice
                      description: Learn Angular Components
                      targetDate: "2026-08-15"
                      done: true
                    - id: 2
                      username: alice
                      description: Build Todo List UI
                      targetDate: "2026-08-20"
                      done: false
                User has no todos:
                  value: []

    post:
      tags: [todos]
      summary: Create a todo
      description: |
        ### Three things you must get right

        **① Do not trust the `id` in the request body.**
        The frontend sends `"id": -1` — that is only a signal meaning "this is a new one"
        (see `todo/todo.ts`). The backend assigns the real id.

        **② Trust only the `username` from the path.**
        Ignore and overwrite whatever the body says, otherwise anyone can create todos for
        somebody else.

        **③ The response must carry the created object.**
        The frontend declares `Observable<Todo>`, and **only the backend knows the new id**.
        Returning a bare `201` with an empty body hands the frontend a `null` — it does not
        fail to compile and it does not crash at runtime, but the type is now a lie. That is
        the hardest kind of bug to track down.
      operationId: createTodo
      x-lesson-step: Step 8-① / Step 8-②
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoInput"
            example:
              id: -1
              description: Learn REST properly
              targetDate: "2026-12-31"
              done: false
      responses:
        "201":
          description: |
            Created. **Note this is 201, not 200** — "I did not merely handle your request,
            I brought a new thing into existence."
          headers:
            Location:
              description: >
                Full URL of the new resource. Let `ResponseEntity.created(uri)` set it —
                do not hand-assemble the string.
              schema:
                type: string
              example: http://localhost:8080/users/alice/todos/6
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
              example:
                id: 6
                username: alice
                description: Learn REST properly
                targetDate: "2026-12-31"
                done: false
        "400":
          $ref: "#/components/responses/BadRequest"

  /users/{username}/todos/{id}:
    parameters:
      - $ref: "#/components/parameters/Username"
      - $ref: "#/components/parameters/TodoId"

    get:
      tags: [todos]
      summary: Fetch a single todo
      description: |
        The frontend uses this to populate the form on the detail page (after clicking Update).

        **When it does not exist, return 404 — not `200 + null`.**
        `200 + null` says "I found it, and it is empty". That is a lie.
      operationId: getTodo
      x-lesson-step: Step 5-① / Step 5-④
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [todos]
      summary: Update an existing todo
      description: |
        ### Two things you must get right

        **① The `id` in the path wins; ignore the one in the body.**
        Otherwise `PUT /users/alice/todos/2` carrying `{"id": 999}` would edit row 999 —
        even one that belongs to somebody else. **Never trust an identifier from a request body.**

        **② Mutate the fields in place; do not "remove then append".**
        Removing and re-appending sends the edited row to the bottom of the list, and the user
        thinks they accidentally created a new one. Backend implementation details leak into
        the user experience.

        > PUT is **idempotent**: sending the same request a hundred times leaves the server in
        > the same state as sending it once.
      operationId: updateTodo
      x-lesson-step: Step 7-① / Step 7-②
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoInput"
            example:
              id: 2
              description: Build Todo List UI - updated
              targetDate: "2027-01-15"
              done: true
      responses:
        "200":
          description: Success — returns the updated object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [todos]
      summary: Delete a todo
      description: |
        **On success return 204 No Content — with no response body.**

        Line the three up: the frontend writes `Observable<void>`, the backend writes
        `ResponseEntity<Void>`, and on the wire it is `204`. **All three say the same thing.**

        Because there is no response body, the frontend has to re-fetch the list after
        deleting — the backend is the single source of truth, and the frontend array is only
        a copy of it.
      operationId: deleteTodo
      x-lesson-step: Step 6-① / Step 6-②
      responses:
        "204":
          description: Deleted, no response body
        "404":
          $ref: "#/components/responses/NotFound"

components:

  parameters:
    Username:
      name: username
      in: path
      required: true
      description: Owner of the todo. The frontend reads it from `AuthService.username`; the demo login user is `alice`.
      schema:
        type: string
      example: alice

    TodoId:
      name: id
      in: path
      required: true
      description: Todo id, assigned by the backend.
      schema:
        type: integer
        format: int64
      example: 1

  schemas:

    HelloWorldBean:
      type: object
      description: Implemented on the backend as `record HelloWorldBean(String message)`.
      required: [message]
      properties:
        message:
          type: string
          description: The greeting
          example: Hello World

    Todo:
      type: object
      description: |
        Must line up exactly with `interface Todo` in the frontend's `model/todo.ts`.

        **The two that most often fail to line up:**
        - The field is `done`, not `isDone` — in Java the field is `done`, the getter is
          `isDone()`, and Jackson strips the `is` to get `done`.
          **Jackson reads getters, not fields**: forget the getter and the field silently
          disappears from the JSON.
        - `targetDate` is the short form `"2026-08-15"` — use `LocalDate` on the Java side.
          `java.util.Date` serializes to `"2026-08-15T00:00:00.000+00:00"`, which forces the
          frontend to clean up after you with `slice(0, 10)`.
      required: [id, description, targetDate, done]
      properties:
        id:
          type: integer
          format: int64
          description: Assigned by the backend; read-only for the frontend.
          example: 1
        username:
          type: string
          description: Owner. Filled in by the backend from the path parameter; whatever the body says is overwritten.
          example: alice
        description:
          type: string
          minLength: 5
          description: What the todo says. **At least 5 characters**, otherwise 400.
          example: Learn Angular Components
        targetDate:
          type: string
          format: date
          description: Target date, `yyyy-MM-dd`. Maps to Java's `LocalDate` and the frontend's `<input type="date">`.
          example: "2026-08-15"
        done:
          type: boolean
          description: Whether it is finished.
          example: false

    TodoInput:
      type: object
      description: |
        The request body for POST and PUT. Almost identical to `Todo`, but the meaning differs:

        - `id`: **ignored by the backend.** The frontend sends `-1` on POST; on PUT the path wins.
        - `username`: **ignored and overwritten** with the one from the path.

        > Real projects usually define separate classes (DTOs) for the request body and the
        > response, so that "what a client may submit" and "what the backend stores" do not
        > collapse into one type. This lesson skips that to keep one fewer concept in play.
      required: [description, targetDate, done]
      properties:
        id:
          type: integer
          format: int64
          description: Ignored. The frontend always sends `-1` on POST.
          example: -1
        description:
          type: string
          minLength: 5
          example: Learn REST properly
        targetDate:
          type: string
          format: date
          example: "2026-12-31"
        done:
          type: boolean
          example: false

    ErrorResponse:
      type: object
      description: |
        Every error response uses this shape, produced centrally by `@RestControllerAdvice`.

        **The `message` field is not optional** — the frontend reads `error.error.message`.
        `ResponseEntity.notFound().build()` returns an **empty body**, which leaves the
        frontend showing `Http failure response for http://...` and nothing useful.
      required: [timestamp, status, message]
      properties:
        timestamp:
          type: string
          format: date-time
          description: |
            When the error happened. Java uses `Instant`, not `LocalDateTime` —
            the latter serializes without a time zone, which is not valid RFC 3339
            and fails the `format: date-time` check.
          example: "2026-08-08T10:12:33.412Z"
        status:
          type: integer
          description: Matches the HTTP status code
          example: 404
        message:
          type: string
          description: Human-readable explanation. **This is the sentence the frontend displays.**
          example: No todo with id=99999 exists for user alice
        path:
          type: string
          example: /users/alice/todos/99999

  responses:

    BadRequest:
      description: |
        The request body is not acceptable. What currently triggers it:
        - `description` missing or shorter than 5 characters
        - `targetDate` missing
        - malformed JSON / a date that is not `yyyy-MM-dd` / `Todo` missing its no-arg constructor

        > The frontend's `required minlength="5"` is only about experience —
        > **curl and Postman never open your page.**
        > Frontend validation is a convenience; backend validation is the defence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-08-08T10:12:33.412Z"
            status: 400
            message: description must be at least 5 characters
            path: /users/alice/todos

    NotFound:
      description: |
        This user has no todo with that id.

        **Note**: asking for someone else's todo also returns 404, not 403.
        Saying "you are not allowed" would itself reveal that the record exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            timestamp: "2026-08-08T10:12:33.412Z"
            status: 404
            message: No todo with id=99999 exists for user alice
            path: /users/alice/todos/99999
